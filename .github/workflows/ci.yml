name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_docker:
        description: Build the optional private Docker image
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:libsql
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --omit=dev
  publish:
    name: Publish private Docker image
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nexeneagency/nexene-ops-app:latest
            ghcr.io/nexeneagency/nexene-ops-app:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/NexeneAgency/nexene-ops-app
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container package is private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility="$(gh api orgs/NexeneAgency/packages/container/nexene-ops-app --jq .visibility)"
          test "$visibility" = private
