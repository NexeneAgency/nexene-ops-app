services:
  ops:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_URL: ${APP_URL:?Set APP_URL}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS}
      DATA_DIR: /app/data
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
    volumes:
      - ops_data:/app/data
      - ./backups:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
volumes:
  ops_data:
